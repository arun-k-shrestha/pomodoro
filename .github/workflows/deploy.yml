name: Deploy Next.js to AWS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build OpenNext output
        run: npx --yes open-next build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload static files to S3
        run: |
          aws s3 sync .next/static s3://pomodoro-app-800889009607-us-east-1-an/_next/static \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Create Lambda deployment package
        run: |
          cd .open-next/server-function
          zip -r ../../lambda-package.zip .

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name first_lambda \
            --zip-file fileb://lambda-package.zip \
            --publish

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name first_lambda

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E27KFQL02IM521 \
            --paths "/*"
